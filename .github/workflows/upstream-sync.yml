name: upstream-sync

# Merges ggml-org/llama.cpp into a branch once a week and opens a PR.
# Never pushes to main directly.
#
# The CPU build below is a smoke test, not a guarantee. GitHub runners have no
# CUDA, Metal or Vulkan toolchain, so the TurboQuant kernels are NOT compiled
# here. A green check means the merge did not break src/, common/ or the CPU
# backend. Build the PR branch on a GPU before merging.

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp
          git fetch --no-tags upstream master

      - name: Report gap
        id: gap
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/master)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "$BEHIND commits behind upstream"

      - name: Merge upstream onto sync branch
        if: steps.gap.outputs.behind != '0'
        id: merge
        run: |
          echo "branch=sync/upstream-$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          git checkout -B "sync/upstream-$(date +%Y%m%d)"
          if git merge upstream/master --no-edit; then
            echo "conflicted=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git add -A
            git commit -m "sync: merge upstream llama.cpp (conflict markers included)"
          fi

      - name: Install build deps
        if: steps.merge.outputs.conflicted == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

      # Catches merge artifacts that produce no conflict at all:
      # duplicate definitions, dropped members, renamed symbols.
      - name: CPU smoke build
        if: steps.merge.outputs.conflicted == 'false'
        id: build
        continue-on-error: true
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF
          cmake --build build -j"$(nproc)"

      - name: Push sync branch
        if: steps.gap.outputs.behind != '0'
        run: git push -f origin "${{ steps.merge.outputs.branch }}"

      - name: Open or update PR
        if: steps.gap.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          BEHIND: ${{ steps.gap.outputs.behind }}
          CONFLICTED: ${{ steps.merge.outputs.conflicted }}
          BUILD: ${{ steps.build.outcome }}
          FILES: ${{ steps.merge.outputs.files }}
        run: |
          {
            echo "Automated weekly sync with [ggml-org/llama.cpp](https://github.com/ggml-org/llama.cpp)."
            echo
            echo "Behind upstream by **$BEHIND** commits."
            echo
            if [ "$CONFLICTED" = "true" ]; then
              echo "### Conflicts"
              echo
              echo "Merge hit conflicts. **Conflict markers are committed on this branch** and must be resolved by hand."
              echo
              echo '```'
              echo "$FILES"
              echo '```'
            elif [ "$BUILD" = "failure" ]; then
              echo "### CPU build failed"
              echo
              echo "The merge was conflict-free but the CPU build broke. This is usually a cherry-pick collision or a relocated symbol, neither of which produces a conflict marker. See the failed \`CPU smoke build\` step."
            else
              echo "### Clean"
              echo
              echo "Merged with no conflicts and the CPU build passed."
            fi
            echo
            echo "---"
            echo
            echo "**The CPU build does not cover CUDA, Metal, Vulkan or SYCL.** The TurboQuant kernels are not compiled in CI. Build this branch on a GPU before merging."
          } > body.md

          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "sync: upstream llama.cpp ($(date +%Y-%m-%d))" \
              --body-file body.md
          else
            gh pr edit "$BRANCH" --body-file body.md
          fi
